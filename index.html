<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluent Glass Calculator</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="styles.css">
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Calculator Body Wrapper -->
    <div class="calculator-wrapper">
        
        <!-- Header Panel -->
        <header class="calc-header">
            <div class="calc-title">Calculator</div>
            <button class="icon-btn" id="btn-history-toggle" title="Show History">
                <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
        </header>

        <!-- Display Screen -->
        <div class="calc-screen">
            <div class="screen-formula" id="formula-display"></div>
            <div class="screen-result" id="result-display">0</div>
        </div>

        <!-- Keypad Grid -->
        <div class="calc-keypad">
            <!-- Row 1 -->
            <button class="calc-btn btn-action btn-clear" data-value="clear" id="key-clear">C</button>
            <button class="calc-btn btn-action" data-value="sign" id="key-sign">±</button>
            <button class="calc-btn btn-action" data-value="percent" id="key-percent">%</button>
            <button class="calc-btn btn-action" data-value="backspace" id="key-backspace" title="Backspace">
                <i class="fa-solid fa-backspace"></i>
            </button>

            <!-- Row 2 -->
            <button class="calc-btn btn-action" data-value="square" id="key-square">x²</button>
            <button class="calc-btn btn-action" data-value="sqrt" id="key-sqrt">√</button>
            <button class="calc-btn btn-operator" data-value="divide" id="key-divide">÷</button>
            <button class="calc-btn btn-operator" data-value="multiply" id="key-multiply">×</button>

            <!-- Row 3 -->
            <button class="calc-btn btn-num" data-value="7" id="key-7">7</button>
            <button class="calc-btn btn-num" data-value="8" id="key-8">8</button>
            <button class="calc-btn btn-num" data-value="9" id="key-9">9</button>
            <button class="calc-btn btn-operator" data-value="subtract" id="key-subtract">−</button>

            <!-- Row 4 -->
            <button class="calc-btn btn-num" data-value="4" id="key-4">4</button>
            <button class="calc-btn btn-num" data-value="5" id="key-5">5</button>
            <button class="calc-btn btn-num" data-value="6" id="key-6">6</button>
            <button class="calc-btn btn-operator" data-value="add" id="key-add">+</button>

            <!-- Row 5 & 6 (Combined Grid Layout) -->
            <button class="calc-btn btn-num" data-value="1" id="key-1">1</button>
            <button class="calc-btn btn-num" data-value="2" id="key-2">2</button>
            <button class="calc-btn btn-num" data-value="3" id="key-3">3</button>
            
            <!-- Equals key spans 2 rows on the right -->
            <button class="calc-btn btn-equal" data-value="equals" id="key-equals" style="grid-row: span 2; height: 100%;">=</button>

            <button class="calc-btn btn-num btn-zero" data-value="0" id="key-0" style="grid-column: span 2;">0</button>
            <button class="calc-btn btn-num" data-value="decimal" id="key-decimal">.</button>
        </div>

        <!-- Sliding History Drawer -->
        <div class="history-drawer" id="history-drawer">
            <div class="drawer-header">
                <div class="drawer-title">History</div>
                <button class="icon-btn" id="btn-clear-history" title="Clear History">
                    <i class="fa-solid fa-trash-can"></i>
                </button>
                <button class="icon-btn" id="btn-history-close" title="Close">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="history-list" id="history-list">
                <div class="history-empty">No history yet</div>
            </div>
        </div>

        <!-- Keyboard Hints Overlay -->
        <div class="keyboard-hints" id="keyboard-hints">
            <h5>Keyboard Shortcuts</h5>
            <div class="hints-grid">
                <div class="hint-row">
                    <span>Numbers</span>
                    <span class="hint-key">0 - 9</span>
                </div>
                <div class="hint-row">
                    <span>Operations</span>
                    <span class="hint-key">+ - * /</span>
                </div>
                <div class="hint-row">
                    <span>Calculate</span>
                    <span class="hint-key">Enter / =</span>
                </div>
                <div class="hint-row">
                    <span>Backspace</span>
                    <span class="hint-key">Backspace</span>
                </div>
                <div class="hint-row">
                    <span>Clear All</span>
                    <span class="hint-key">Esc / Del</span>
                </div>
                <div class="hint-row">
                    <span>Sign toggle</span>
                    <span class="hint-key">s</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Script -->
    <script src="app.js"></script>
</body>
</html>
